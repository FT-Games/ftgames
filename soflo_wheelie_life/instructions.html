<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Soflo Wheelie Life Instructions - FT Games</title>
  <link rel="icon" type="image/x-icon" href="/images/favicon.png">
  <style>
    body { margin: 0; background: #000; color: #fff; font: 16px/1.8 "Segoe UI", Arial, sans-serif; }
    main { max-width: 900px; margin: auto; padding: 24px; text-align: center; }
    header { display: flex; align-items: center; justify-content: center; gap: 16px; }
    header img { width: 60px; height: auto; }
    h1 { font-size: clamp(28px, 6vw, 46px); line-height: 1.15; color: #00e5ff; }
    h2 { margin: 0; font-size: 28px; color: #7cffcb; }
    section { margin-top: 28px; }
    p { margin: 8px 0 0; }
    .controls { display: inline-block; padding: 20px 32px; background: #111; border: 2px solid #00e5ff;
      border-radius: 18px; box-shadow: 0 0 25px rgba(0,229,255,.35); }
    .controls h2 { color: #00e5ff; }
    .tips h2 { color: #ffda44; }
    footer { display: inline-block; margin-top: 36px; padding: 12px 24px; border-radius: 999px;
      background: linear-gradient(90deg,#00e5ff,#00ff99); color: #000; font-weight: 900; }
  </style>
</head>
<body>
  <main>
    <header>
      <img src="../images/favicon.png" alt="FT Games logo">
      <h1>Soflo Wheelie Life</h1>
    </header>
    <section class="controls">
      <h2>🎮 Controls</h2>
      <p><strong>D or →</strong> to apply the throttle.<br>
      <strong>A or ←</strong> to brake.</p>
    </section>
    <section>
      <h2>⚡ How to play</h2>
      <p>Lift the front wheel and see how long you can keep it off the ground.</p>
    </section>
    <section class="tips">
      <h2>⭐ Tips</h2>
      <p>Ease off the throttle and tap the brake if the bike starts to tip too far back.</p>
    </section>
    <footer>Lift the wheel • Balance the bike</footer>
  </main>
</body>
</html>
