---
- name: Add recommendations (client-side)
  description: |
    Adds a client-side "Recommended for you" section on games.html. Tracks clicks and
    genre preferences in a cookie and shows recommendations based on click counts,
    then by favorite genres, then fallbacks.

    To test locally: open games.html, click a few game cards, refresh the page — the
    "Recommended for you" list will update.

  files_changed:
    - assets/js/recommendations.js
    - games.html (script include)

  notes: |
    - Storage uses a JSON cookie named `ftgames_prefs_v1`. Switch to localStorage if you
      expect many games or longer data.

---
